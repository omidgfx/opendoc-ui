  links:
    LinkedResource:
      operationId: getLinkedResource
      parameters:
        id: '$response.body#/id'
      description: Follow an ID returned in a response.

  schemas:
    HelloMessage:
      type: object
      title: Hello message
      description: A friendly response used by the first endpoint.
      required: [message, product, capabilities]
      properties:
        message:
          type: string
          example: Hello from OpenDoc UI
        product:
          type: string
          const: OpenDoc UI
        capabilities:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum: [documentation, runner, schemas, notes, ai]

    EchoEnvelope:
      type: object
      description: |
        A normalized conceptual echo response. The real public server can add fields; this schema is
        intentionally useful for generated examples, property matrices, and TypeScript export.
      required: [requestId, method, url, headers, query]
      properties:
        requestId:
          type: string
          format: uuid
          readOnly: true
          description: Server-generated correlation ID; omitted from request mocks.
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE, QUERY, PURGE]
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        query:
          type: object
          additionalProperties: true
        body:
          description: Parsed body, text, or null.
          type: [object, array, string, number, boolean, 'null']
        receivedSecret:
          type: string
          writeOnly: true
          description: Demonstrates response-mock omission for write-only fields.

    BaseRequest:
      type: object
      required: [clientRequestId]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: |
            Client-generated idempotency identifier.

            See the [UUID specification](https://www.rfc-editor.org/rfc/rfc9562) for format guidance.
          externalDocs:
            description: RFC 9562
            url: https://www.rfc-editor.org/rfc/rfc9562
          example: 123e4567-e89b-12d3-a456-426614174000
        clientVersion:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
          default: 1.0.0

    RichRequest:
      title: Rich request form
      description: The central request-schema showcase used by the rich JSON endpoint.
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [title, mode]
          properties:
            title:
              type: string
              minLength: 3
              maxLength: 80
              pattern: '^[A-Za-z0-9][A-Za-z0-9 _.-]+$'
              description: |
                A human-readable title. This **Markdown description** is intentionally long enough to
                move into OpenDoc's closable field-description popover and includes `inline code`.
              default: OpenDoc showcase
            mode:
              type: string
              enum: [dry-run, live, replay]
              default: dry-run
              description: |
                #### Available values

                | Value | Case | Meaning |
                |---|---|---|
                | `dry-run` | DRY_RUN | Prepare but do not commit |
                | `live` | LIVE | Execute against the selected server |
                | `replay` | REPLAY | Repeat a previously stored scenario |
            priority:
              type: integer
              format: int32
              minimum: 0
              maximum: 10
              multipleOf: 1
              default: 5
            ratio:
              type: number
              format: double
              exclusiveMinimum: 0
              exclusiveMaximum: 1
              multipleOf: 0.05
              default: 0.75
            enabled:
              type: boolean
              default: true
            scheduledAt:
              type: string
              format: date-time
              example: '2026-08-15T12:30:00Z'
            dueDate:
              type: string
              format: date
              example: '2026-08-20'
            contactEmail:
              type: string
              format: email
              example: developer@example.com
            website:
              type: string
              format: uri
              example: https://github.com/omidgfx/opendoc-ui
            ipAddress:
              type: string
              format: ipv4
              example: 192.0.2.10
            ipv6Address:
              type: string
              format: ipv6
              example: 2001:db8::1
            hostname:
              type: string
              format: hostname
              example: api.example.com
            reference:
              type: string
              format: uri-reference
              example: /v1/customers/42
            accountId:
              type: integer
              format: int64
              example: 724983915734013
            temperature:
              type: number
              format: float
              example: 36.6
            payload:
              type: string
              format: byte
              description: Base64-encoded payload — exercises the byte string format badge.
              example: aGVsbG8=
            secret:
              type: string
              format: password
              writeOnly: true
              description: Sensitive input omitted from response examples and redacted from AI context.
            serverReceipt:
              type: string
              readOnly: true
              description: Read-only server output omitted from the request form default.
            nullableNote:
              type: [string, 'null']
              description: Use **Set null** to emit a real JSON null value.
              example: null
            constantKind:
              type: string
              const: showcase
              default: showcase
            tags:
              type: array
              minItems: 1
              maxItems: 6
              uniqueItems: true
              description: Add, remove, and reorder documented or custom array values.
              items:
                type: string
                enum: [docs, runner, schemas, notes, ai, demo]
            owner:
              $ref: '#/components/schemas/UserProfile'
              description: Direct description plus linked reusable schema documentation.
            checkpoints:
              type: array
              minItems: 1
              maxItems: 5
              items:
                $ref: '#/components/schemas/Checkpoint'
            matrix:
              type: array
              maxItems: 4
              items:
                type: array
                maxItems: 4
                items:
                  type: integer
            metadata:
              type: object
              description: A dynamic map. Use **Add property** in the generated form.
              additionalProperties:
                type: string
            labels:
              $ref: '#/components/schemas/LocalizedLabels'
              description: Locale-tagged labels with advanced object-keyword constraints.
            pet:
              $ref: '#/components/schemas/Pet'
            flexibleValue:
              anyOf:
                - type: string
                  title: Text value
                - type: integer
                  title: Numeric value
                - type: 'null'
              description: anyOf branch selector including a pure-null option.

    LocalizedLabels:
      title: Advanced object-keyword map
      description: |
        Exercises Draft 2020-12 object keywords beyond `properties`:

        - `patternProperties` for locale-tagged keys such as `en` or `fa-IR`.
        - `minProperties` / `maxProperties` object bounds.
        - `unevaluatedProperties: false` to reject undeclared keys.

        The regular `default` property renders in the form and schema matrix;
        the patterned keys remain fully editable in Raw JSON mode and visible in
        the Schema Explorer and TypeScript export.
      type: object
      minProperties: 1
      maxProperties: 8
      properties:
        default:
          type: string
          description: Fallback label shown when no locale key matches.
          example: Overview
      patternProperties:
        '^[a-z]{2}(-[A-Z]{2})?$':
          type: string
          description: Locale-tagged label, for example `en` or `fa-IR`.
      unevaluatedProperties: false

    UserProfile:
      type: object
      description: Reusable user profile with nested address data.
      externalDocs:
        description: User-profile design guide
        url: https://example.com/docs/user-profile
      required: [id, displayName]
      properties:
        id:
          type: string
          pattern: '^user_[A-Za-z0-9]+$'
          example: user_123
        displayName:
          type: string
          minLength: 1
          example: Original Developer
        address:
          $ref: '#/components/schemas/Address'
        roles:
          type: array
          items:
            type: string
            enum: [viewer, editor, owner]

    Address:
      type: object
      required: [line1, city, countryCode]
      properties:
        line1: {type: string, example: Damrak 1}
        line2: {type: [string, 'null'], example: null}
        city: {type: string, example: Amsterdam}
        postalCode: {type: string, pattern: '^[0-9]{4} ?[A-Z]{2}$', example: 1012 LG}
        countryCode: {type: string, pattern: '^[A-Z]{2}$', example: NL}

    Checkpoint:
      type: object
      required: [name, passed]
      properties:
        name: {type: string, example: Parse}
        passed: {type: boolean, default: false}
        durationMs: {type: integer, minimum: 0, example: 12}

    SearchFilter:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/WorkflowState'
        owner:
          type: string
        createdAfter:
          type: string
          format: date-time

    WorkflowState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
      description: |
        #### Workflow state values

        | Value | Label | Meaning |
        |---|---|---|
        | `queued` | Waiting | Accepted but not started |
        | `running` | In progress | Work is currently executing |
        | `succeeded` | Complete | Finished successfully |
        | `failed` | Failed | Finished with an error |
        | `cancelled` | Cancelled | Stopped by a user or system |
      example: running

    CustomerCommand:
      title: Customer command
      description: Named oneOf branches used by both documentation and the Runner.
      oneOf:
        - $ref: '#/components/schemas/CreateCustomer'
        - $ref: '#/components/schemas/LinkExistingCustomer'
        - $ref: '#/components/schemas/DeleteCustomerData'
        - type: 'null'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/CreateCustomer'
          link: '#/components/schemas/LinkExistingCustomer'
          delete-data: '#/components/schemas/DeleteCustomerData'

    CreateCustomer:
      title: Create a new customer
      type: object
      required: [kind, name, email]
      properties:
        kind: {type: string, const: create}
        name: {type: string, minLength: 1, example: Ada Lovelace}
        email: {type: string, format: email, example: ada@example.com}
        address: {$ref: '#/components/schemas/Address'}

    LinkExistingCustomer:
      title: Link an existing customer
      type: object
      required: [kind, customerId]
      properties:
        kind: {type: string, const: link}
        customerId:
          type: string
          pattern: '^cust_[A-Za-z0-9]+$'
          example: cust_123

    DeleteCustomerData:
      title: Delete customer data
      type: object
      required: [kind, customerId, confirmation]
      properties:
        kind: {type: string, const: delete-data}
        customerId: {type: string, example: cust_123}
        confirmation: {type: string, const: DELETE, default: DELETE}

    Customer:
      type: object
      required: [id, name, status]
      properties:
        id: {type: string, pattern: '^cust_[A-Za-z0-9]+$', readOnly: true, example: cust_123}
        name: {type: string, example: Ada Lovelace}
        status: {$ref: '#/components/schemas/WorkflowState'}
        createdAt: {type: string, format: date-time, readOnly: true}

    CustomerPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Customer'}
        page: {type: integer, minimum: 1, example: 1}
        pageSize: {type: integer, minimum: 1, example: 20}
        total: {type: integer, minimum: 0, example: 2}

    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'

    Cat:
      type: object
      required: [petType, name, huntingSkill]
      properties:
        petType: {type: string, const: cat}
        name: {type: string, example: Luna}
        huntingSkill:
          type: string
          enum: [clueless, lazy, adventurous, aggressive]
          default: lazy

    Dog:
      type: object
      required: [petType, name, packSize]
      properties:
        petType: {type: string, const: dog}
        name: {type: string, example: Milo}
        packSize: {type: integer, minimum: 0, default: 1}

    TreeNode:
      type: object
      description: Directly recursive tree node; expansion stops at the first cycle.
      required: [id, label, children]
      properties:
        id: {type: string, example: node_1}
        label: {type: string, example: Root node}
        parent:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/TreeNode'
        children:
          type: array
          items:
            anyOf:
              - type: 'null'
              - $ref: '#/components/schemas/TreeNode'

    RecursiveA:
      type: object
      description: First half of an indirect recursive pair.
      properties:
        name: {type: string}
        b: {$ref: '#/components/schemas/RecursiveB'}

    RecursiveB:
      type: object
      description: Second half of an indirect recursive pair.
      properties:
        enabled: {type: boolean}
        a: {$ref: '#/components/schemas/RecursiveA'}

    FormSubmission:
      type: object
      required: [name]
      properties:
        name: {type: string, example: OpenDoc demo}
        enabled: {type: boolean, default: true}
        tags:
          type: array
          items: {type: string}
        metadata:
          type: object
          additionalProperties: true

    MultipartSubmission:
      type: object
      required: [title, attachment]
      properties:
        title: {type: string, example: Demo upload}
        metadata:
          type: object
          properties:
            category: {type: string, example: showcase}
            public: {type: boolean, default: false}
        tags:
          type: array
          items: {type: string}
        attachment:
          type: string
          format: binary
          description: Primary file upload.
        thumbnail:
          type: [string, 'null']
          format: binary
          description: Optional second file.

    XmlMessage:
      type: object
      xml:
        name: message
        namespace: https://example.com/opendoc
        prefix: od
      required: [title, enabled]
      properties:
        title:
          type: string
          xml: {name: title}
          example: OpenDoc UI
        enabled:
          type: boolean
          xml: {name: enabled}
          default: true
        labels:
          type: array
          xml: {name: labels, wrapped: true}
          items:
            type: string
            xml: {name: label}

    ShowcaseBookModel:
      type: object
      xml:
        name: Book
      required: [format, pages]
      properties:
        format:
          type: string
          enum: [paperback, hardcover, ebook]
        pages:
          type: integer
          example: 350

    ShowcaseElectronicModel:
      type: object
      xml:
        name: Electronic
      required: [voltage, wattage]
      properties:
        voltage:
          type: integer
          example: 120
        wattage:
          type: number
          example: 60.5

    ShowcaseApparelModel:
      type: object
      xml:
        name: Apparel
      required: [size, material]
      properties:
        size:
          type: string
          enum: [S, M, L, XL]
        material:
          type: string
          example: Cotton

    ShowcaseItemRequest:
      type: object
      xml:
        name: ShowcaseItemRequest
      required: [id, name, details]
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Sample Item
        details:
          description: Inline oneOf details block
          oneOf:
            - title: BookDetails
              type: object
              xml: {name: Book}
              required: [format, pages]
              properties:
                format:
                  type: string
                  enum: [paperback, hardcover, ebook]
                pages:
                  type: integer
                  example: 350
            - title: ElectronicDetails
              type: object
              xml: {name: Electronic}
              required: [voltage, wattage]
              properties:
                voltage:
                  type: integer
                  example: 120
                wattage:
                  type: number
                  example: 60.5
            - title: ApparelDetails
              type: object
              xml: {name: Apparel}
              required: [size, material]
              properties:
                size:
                  type: string
                  enum: [S, M, L, XL]
                material:
                  type: string
                  example: Cotton

    ShowcaseItemResponse:
      type: object
      xml:
        name: ShowcaseItemResponse
      required: [id, name, details]
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Sample Item
        details:
          oneOf:
            - $ref: '#/components/schemas/ShowcaseBookModel'
            - $ref: '#/components/schemas/ShowcaseElectronicModel'
            - $ref: '#/components/schemas/ShowcaseApparelModel'

    ShowcaseItemRequestReusable:
      type: object
      xml:
        name: ShowcaseItemRequestReusable
      required: [id, name, details]
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Sample Item Reusable
        details:
          oneOf:
            - $ref: '#/components/schemas/ShowcaseBookModel'
            - $ref: '#/components/schemas/ShowcaseElectronicModel'
            - $ref: '#/components/schemas/ShowcaseApparelModel'

    ShowcaseItemResponseReusable:
      type: object
      xml:
        name: ShowcaseItemResponseReusable
      required: [id, name, details]
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Sample Item Reusable
        details:
          oneOf:
            - $ref: '#/components/schemas/ShowcaseBookModel'
            - $ref: '#/components/schemas/ShowcaseElectronicModel'
            - $ref: '#/components/schemas/ShowcaseApparelModel'

    FreeFormObject:
      type: object
      description: Free-form object with arbitrary JSON properties.
      additionalProperties: true
      example:
        product: OpenDoc UI
        enabled: true

    Money:
      type: object
      required: [currency, value]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: EUR
        value:
          type: number
          multipleOf: 0.01
          minimum: 0
          example: 19.95

    CreateJobRequest:
      type: object
      required: [task, callbackUrl]
      properties:
        task:
          type: string
          enum: [export-customer-data, rebuild-index, send-digest]
        callbackUrl:
          type: string
          format: uri
        options:
          type: object
          additionalProperties: true

    AsyncJob:
      type: object
      required: [id, state, progress]
      properties:
        id: {type: string, pattern: '^job_[A-Za-z0-9]+$', readOnly: true}
        state: {$ref: '#/components/schemas/WorkflowState'}
        progress: {type: number, minimum: 0, maximum: 1, default: 0}
        result:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        createdAt: {type: string, format: date-time, readOnly: true}

    Problem:
      type: object
      description: RFC 9457-style problem details with optional recursive causes.
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference, default: about:blank}
        title: {type: string}
        status: {type: integer, minimum: 100, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        traceId: {type: string}
        causes:
          type: array
          items:
            anyOf:
              - type: 'null'
              - $ref: '#/components/schemas/Problem'
      additionalProperties: true

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: {type: string, example: /title}
        code: {type: string, example: required}
        message: {type: string, example: Title is required}
        rejectedValue: {}

    CatalogItem:
      title: Catalog item draft
      description: |
        Field-level combinator laboratory used by **00 Spotlight / Draft a catalog item**.

        - `payment` — exclusive **oneOf** (card / wire / store credit)
        - `fulfillment` — **anyOf** array merge of ship / pickup / email channels
        - `identity` — **allOf** composition focus
        - `marker` — **not** (reject blank sentinel) for inspection-only UI
      type: object
      required: [sku, title, payment, identity]
      properties:
        sku:
          type: string
          pattern: '^SKU-[0-9]{3,6}$'
          example: SKU-1001
          description: Stock-keeping unit shown in the matrix and pattern tester.
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: OpenDoc field guide
        payment:
          description: |
            Exclusive payment rail. Use the field **oneOf** menu or the caret after `payment` in the
            generated example — only one branch stays expanded for mocks.
          oneOf:
            - $ref: '#/components/schemas/CardPayment'
            - $ref: '#/components/schemas/WirePayment'
            - $ref: '#/components/schemas/StoreCreditPayment'
          discriminator:
            propertyName: method
            mapping:
              card: '#/components/schemas/CardPayment'
              wire: '#/components/schemas/WirePayment'
              store-credit: '#/components/schemas/StoreCreditPayment'
        fulfillment:
          description: |
            Multi-select **anyOf** channels. Empty selection means none; **All** selects every branch.
            OpenDoc merges selected object branches into one documentation view.
          type: array
          minItems: 1
          items:
            anyOf:
              - $ref: '#/components/schemas/ShipChannel'
              - $ref: '#/components/schemas/PickupChannel'
              - $ref: '#/components/schemas/EmailChannel'
        identity:
          description: allOf profile stamp — focus a part to dim the rest.
          allOf:
            - $ref: '#/components/schemas/UserProfile'
            - type: object
              title: Checkout contact override
              properties:
                phone:
                  type: [string, 'null']
                  pattern: '^\+?[0-9 \-]{7,20}$'
                  example: '+31 6 1234 5678'
                company:
                  type: string
                  example: Analytical Engines BV
        marker:
          description: |
            JSON Schema **not** — values matching the negated schema are rejected.
            OpenDoc shows this for inspection only (no exclusive collapse).
          not:
            const: __FORBIDDEN__
        notes:
          type: [string, 'null']
          maxLength: 500
          example: Gift wrap

    CardPayment:
      title: Card
      type: object
      required: [method, brand, last4]
      properties:
        method: {type: string, const: card}
        brand: {type: string, enum: [visa, mastercard, amex], example: visa}
        last4: {type: string, pattern: '^[0-9]{4}$', example: '4242'}
        capture:
          type: string
          enum: [immediate, manual]
          default: immediate

    WirePayment:
      title: Wire transfer
      type: object
      required: [method, iban, reference]
      properties:
        method: {type: string, const: wire}
        iban: {type: string, pattern: '^[A-Z]{2}[0-9A-Z]+$', example: DE89370400440532013000}
        reference: {type: string, minLength: 1, example: INV-77}

    StoreCreditPayment:
      title: Store credit
      type: object
      required: [method, creditId]
      properties:
        method: {type: string, const: store-credit}
        creditId: {type: string, pattern: '^cred_[A-Za-z0-9]+$', example: cred_9f}
        amount: {$ref: '#/components/schemas/Money'}

    ShipChannel:
      title: Ship
      type: object
      required: [mode, carrier]
      properties:
        mode: {type: string, const: ship}
        carrier: {type: string, enum: [dhl, ups, postnl], example: dhl}
        express: {type: boolean, default: false}

    PickupChannel:
      title: Store pickup
      type: object
      required: [mode, storeId]
      properties:
        mode: {type: string, const: pickup}
        storeId: {type: string, example: store_ams_01}
        holdDays: {type: integer, minimum: 1, maximum: 14, default: 3}

    EmailChannel:
      title: Email delivery
      type: object
      required: [mode, address]
      properties:
        mode: {type: string, const: email}
        address: {type: string, format: email, example: reader@example.com}

    ProductSearch:
      title: Product search body
      description: Structured QUERY body (RFC 10008) — filters live in JSON, not only in the URL.
      type: object
      required: [filter]
      properties:
        filter:
          type: object
          description: Free-form filter object; additional keys are allowed for negative tests.
          properties:
            category:
              type: string
              enum: [shoes, electronics, apparel, books]
              example: shoes
            maxPrice: {type: number, minimum: 0, example: 120}
            minRating: {type: number, minimum: 0, maximum: 5, example: 4}
            inStock: {type: boolean, default: true}
          additionalProperties: true
        sort:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [price_asc, price_desc, name, rating_desc, newest]
          example: [price_asc]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        cursor:
          type: [string, 'null']
          description: Opaque pagination cursor from a previous page.
          example: null

    ProductSearchResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, price]
            properties:
              id: {type: string, example: prod_1}
              name: {type: string, example: Trail runner}
              price: {type: number, example: 89.0}
              category: {type: string, example: shoes}
        nextCursor: {type: [string, 'null'], example: eyJvZmZzZXQiOjIwfQ}
        total: {type: integer, minimum: 0, example: 48}

    SpotlightProfilePatch:
      title: Spotlight profile patch
      description: allOf-assembled profile used by the Spotlight PATCH demo.
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          title: Marketing preferences
          properties:
            marketingOptIn: {type: boolean, default: false}
            locale: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', example: en-GB}
        - type: object
          title: Audit
          properties:
            patchNote: {type: string, maxLength: 200, example: Prefer dark theme defaults}
            revisedAt:
              type: string
              format: date-time
              readOnly: true

    TupleExample:
      type: array
      title: JSON Schema tuple example
      description: Exercises Draft 2020-12 `prefixItems` in Schema Explorer and raw schema editing.
      prefixItems:
        - {type: string}
        - {type: integer}
        - {type: boolean}
      minItems: 3
      maxItems: 3

    ConditionalConfiguration:
      type: object
      title: Conditional JSON Schema example
      description: Exercises `if` / `then` / `else`, dependent requirements, and schema preservation.
      required: [kind]
      properties:
        kind: {type: string, enum: [local, remote]}
        path: {type: string}
        url: {type: string, format: uri}
        token: {type: string, writeOnly: true}
      if:
        properties:
          kind: {const: remote}
      then:
        required: [url]
      else:
        required: [path]
      dependentRequired:
        token: [url]

    ConflictingAllOf:
      title: Deliberately conflicting allOf
      description: Used to demonstrate conflict diagnostics in generated forms without mutating source schemas.
      allOf:
        - type: object
          properties:
            value: {type: string}
        - type: object
          properties:
            value: {type: integer}

    Anything:
      title: Boolean true schema branch
      description: Wraps a literal `true` JSON Schema branch for parser and UI inspection.
      oneOf:
        - true

    Impossible:
      title: Boolean false schema branch
      description: Wraps a literal `false` JSON Schema branch for parser and UI inspection.
      oneOf:
        - false

    NotBlankMarker:
      title: Not-keyword branch
      description: |
        Wraps a JSON Schema `not` constraint — any value except the empty string.
        Available for raw schema inspection and validation alongside the boolean
        branches above.
      not:
        const: ''

    123-widget:
      type: object
      description: Adversarial leading-digit schema name for TypeScript identifier generation.
      properties:
        widget-id: {type: string}

    order-item:
      type: object
      description: Hyphenated schema and property names for code-generation escaping.
      required: [unit-price]
      properties:
        unit-price: {type: number}
        tax.rate: {type: number}

    user.profile:
      type: object
      description: Dot-containing schema name exercises safe TypeScript identifiers and generated filenames.
      properties:
        display-name: {type: string}
        favorite-items:
          type: array
          items: {$ref: '#/components/schemas/order-item'}
