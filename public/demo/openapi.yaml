openapi: 3.2.0
$self: https://omidgfx.github.io/opendoc-ui/demo/demo/openapi.yaml
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: OpenDoc UI — Complete Capability Showcase
  summary: A product-grade OpenAPI 3.2 showcase that exercises SchemaViewer, field combinators, QUERY, and the full workstation.
  version: 2.0.0-demo
  description: |
    # Open a living OpenAPI workstation

    This document is the **public product demo** for OpenDoc UI: dense enough to stress every surface,
    structured enough that a first-time visitor can follow a short tour and *feel* the product.

    ## Five-minute tour (start here)

    | # | Open this | What you should notice |
    |---|---|---|
    | 1 | **00 Spotlight / Catalog draft** | Shared **SchemaViewer** on the request body — meta header, generated example formats, field-level **oneOf / anyOf / allOf / not** menus, and dimming on allOf focus |
    | 2 | **00 Spotlight / Product search (QUERY)** | First-class **OAS 3.2 QUERY** with a real JSON body, named examples, and Runner send |
    | 3 | **00 Spotlight / Bare $ref body** | A body that is only a `$ref` to a combinator still gets the same rails as an inline keyword |
    | 4 | **00 Spotlight / Multi-format response** | Responses reuse the same SchemaViewer: Format picker, named examples, Unified Schema |
    | 5 | **03 Request bodies / Rich JSON** | Deep recursive form, constraints, maps, arrays — Split View with Runner |
    | 6 | **Ctrl/⌘ + K** | Search `QUERY`, `combinator`, `serialization`, `OAuth`, or a path fragment |

    Then explore freely: notes & todos, hide an endpoint, Settings → Appearance, Schema Explorer,
    Runner Compatibility, code gen, and deep links (`#response-400`).

    > **Live requests:** the primary server is [HTTPBin](https://httpbin.org) (CORS echo).
    > Some methods (QUERY, TRACE, PURGE) may fail at the transport layer — that is intentional and still
    > useful in history and compatibility. **Everything else works offline**: docs, examples, forms,
    > schemas, snippets, notes, and AI context.

    | Surface | What this file exercises |
    |---|---|
    | Navigation | Nested tags, **x-tagGroups**, every fixed method, OAS 3.2 **QUERY**, `additionalOperations`, deprecated TRACE |
    | SchemaViewer | Shared request/response/modal surface, multi-format generated examples, named OpenAPI `examples` |
    | Combinators | Body rails **and field menus** for `oneOf` / `anyOf` / `allOf` / `not`, bare `$ref`, discriminators |
    | Parameters | Path/query/header/cookie/`querystring`, styles, explode, content-based, live final URL |
    | Bodies | JSON, vendor JSON, YAML, XML, text, HTML, JS, forms, multipart, binary |
    | Keywords | `$ref`, recursion, maps, enums, `const`, `prefixItems`, `patternProperties`, `unevaluatedProperties`, `if`/`then`/`else`, boolean schemas |
    | Security | Public, Basic, Bearer, API keys, OAuth2 + PKCE, OIDC, cookies, mTLS, AND/OR |
    | Responses | Status gallery, headers, links, binary/streaming, problem+json |
    | Events | Callbacks + provider webhooks on Overview |

    Descriptions intentionally use headings, tables, lists, links, blockquotes, inline `code`, and
    fenced blocks so the Markdown renderer stays visible everywhere.
  termsOfService: https://github.com/omidgfx/opendoc-ui
  contact:
    name: OpenDoc UI
    url: https://github.com/omidgfx/opendoc-ui
    email: opendoc-ui@example.com
  license:
    name: MIT
    identifier: MIT
  x-logo:
    url: ../assets/opendoc-logo.svg
    altText: OpenDoc UI
    backgroundColor: '#0B1020'

externalDocs:
  description: OpenDoc UI repository and product documentation
  url: https://github.com/omidgfx/opendoc-ui

servers:
  - url: https://httpbin.org
    name: httpbin
    description: Live CORS echo service — recommended for the Runner demo
  - url: https://{host}
    name: variable-host
    description: Variable host template — demonstrates server-variable controls
    variables:
      host:
        default: httpbin.org
        enum:
          - httpbin.org
          - postman-echo.com
        description: |
          Pick a host. **HTTPBin** matches the paths in this showcase; the alternative exists to
          demonstrate documented server-variable values and may not implement equivalent routes.
  - url: https://{region}.{environment}.example.com/{version}
    name: conceptual-multiregion
    description: Non-runnable conceptual multi-variable server
    variables:
      region:
        default: eu
        enum: [eu, us, ap]
        description: Deployment region.
      environment:
        default: sandbox
        enum: [sandbox, staging, api]
        description: Deployment environment.
      version:
        default: v1
        enum: [v1, v2]
        description: Base API version.

security: []

x-tagGroups:
  - name: Spotlight
    tags: [00 Spotlight]
  - name: Tour
    tags: [01 Tour, 01 Tour/Servers, 01 Tour/Reusable paths, 01 Tour/HTTP methods]
  - name: Parameters
    tags:
      [
        02 Parameters/Path styles,
        02 Parameters/Query styles,
        02 Parameters/Headers & cookies,
        02 Parameters/Merging & OAS 3.2,
      ]
  - name: Request bodies
    tags:
      [
        03 Request bodies/Rich JSON,
        03 Request bodies/Composition,
        03 Request bodies/Media types,
        03 Request bodies/Forms & files,
        03 Request bodies/Recursion,
      ]
  - name: Responses
    tags: [04 Responses/Status gallery, 04 Responses/Binary & streaming]
  - name: Security
    tags: [05 Security/Public & HTTP, 05 Security/API keys, 05 Security/OAuth & OIDC]
  - name: Events
    tags: [06 Events/Callbacks & links, 06 Events/Webhooks]
  - name: Compatibility
    tags: [07 Compatibility/Browser limits]

tags:
  - name: 00 Spotlight
    description: |
      Flagship OpenDoc UI moments — field combinators, SchemaViewer, and OAS 3.2 QUERY.
      Start here if you only have a few minutes.
  - name: 01 Tour
    description: Start here for a compact overview of navigation, Markdown, servers, and references.
  - name: 01 Tour/Servers
    description: Root, path-item, and operation-level server selection and variables.
  - name: 01 Tour/Reusable paths
    description: Reusable Path Item Objects from `components.pathItems`.
  - name: 01 Tour/HTTP methods
    description: Fixed methods, OAS 3.2 QUERY, and arbitrary additional operations.
  - name: 02 Parameters/Path styles
    description: Simple, label, and matrix path serialization.
  - name: 02 Parameters/Query styles
    description: Form, space-delimited, pipe-delimited, deep-object, and content-based parameters.
  - name: 02 Parameters/Headers & cookies
    description: Header serialization and browser-managed cookie limitations.
  - name: 02 Parameters/Merging & OAS 3.2
    description: Path/operation parameter merging and the OAS 3.2 query-string location.
  - name: 03 Request bodies/Rich JSON
    description: Recursive generated forms with constraints, defaults, examples, maps, and arrays.
  - name: 03 Request bodies/Composition
    description: Selectable oneOf/anyOf branches and allOf composition.
  - name: 03 Request bodies/Media types
    description: Raw editor language switching across structured and textual media.
  - name: 03 Request bodies/Forms & files
    description: URL encoding, multipart FormData, file fields, and encoding metadata.
  - name: 03 Request bodies/Recursion
    description: Cycle-safe forms and schema inspection.
  - name: 04 Responses/Status gallery
    description: Response navigation, headers, examples, schemas, enums, and deep links.
  - name: 04 Responses/Binary & streaming
    description: Safe binary detection, metadata-only handling, truncation, cancellation, and timeouts.
  - name: 05 Security/Public & HTTP
    description: Anonymous operations, Basic auth, and Bearer tokens.
  - name: 05 Security/API keys
    description: Header/query/cookie API keys and composed requirements.
  - name: 05 Security/OAuth & OIDC
    description: OAuth flows, PKCE discovery, scopes, OpenID Connect, and mTLS.
  - name: 06 Events/Callbacks & links
    description: Provider callbacks and response workflow links.
  - name: 06 Events/Webhooks
    description: Provider-initiated operations shown on the specification overview.
  - name: 07 Compatibility/Browser limits
    description: Deliberate browser and contract edge cases for the compatibility matrix.

paths:
  /anything/tour/hello:
    get:
      tags: [01 Tour]
      summary: Start the OpenDoc UI guided tour
      operationId: startGuidedTour
      description: |
        ## A compact first stop

        This operation is intentionally simple so the surrounding OpenDoc workspace is easy to
        introduce before opening denser examples.

        **OpenDoc UI capabilities to demonstrate**

        - Markdown rendering with **emphasis**, `inline code`, lists, links, and a fenced sample.
        - Endpoint tabs, preview-versus-permanent tabs, context menus, sharing, and deep links.
        - Documentation, API Runner, and resizable Split View.
        - Code generation with credentials represented as safe placeholders.
        - Local Markdown notes, todos, endpoint hiding, and per-spec persistence.

        When you are ready for the dense cases, jump to the **00 Spotlight** folder (catalog draft,
        QUERY search, bare `$ref`, multi-format offer, allOf profile).

        ```bash
        curl https://httpbin.org/anything/tour/hello
        ```

        > Try sending this endpoint repeatedly, then use **Response History** to switch between the
        > last ten transaction outcomes. Reload the browser to show that history persists.
      externalDocs:
        description: OpenDoc UI on GitHub
        url: https://github.com/omidgfx/opendoc-ui
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - name: greeting
          in: query
          description: A friendly value echoed by the demo server.
          schema:
            type: string
            minLength: 1
            maxLength: 60
            default: Hello from OpenDoc UI
          example: Hello from OpenDoc UI
      responses:
        '200':
          $ref: '#/components/responses/HelloResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /anything/tour/scoped-server/{tenant}:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    servers:
      - url: https://httpbin.org/anything/path-scope
        description: Path-item server — inherited by GET
    get:
      tags: [01 Tour/Servers]
      summary: Inherit a path-item server
      operationId: demonstratePathServer
      description: |
        ## Path-item server precedence

        This operation has no `servers` field, so OpenDoc resolves the server declared on the Path
        Item Object. The full URL preview and generated snippets should include
        `/anything/path-scope` before this route.

        **Demonstrates:** server precedence, path-level parameters, full-URL copying, and the Runner's
        substituted request URL.
      responses:
        '200':
          $ref: '#/components/responses/EchoResponse'
    post:
      tags: [01 Tour/Servers]
      summary: Override with an operation server and variables
      operationId: demonstrateOperationServer
      description: |
        ## Operation-level server precedence

        The POST operation overrides the Path Item server with a variable base path.

        - `basePath=anything/operation-scope` is the documented default.
        - OpenDoc resolves operation servers before path and root servers.
        - The selected server, path value, and body are reflected in generated code.
      servers:
        - url: https://httpbin.org/{basePath}
          description: Operation-specific variable server
          variables:
            basePath:
              default: anything/operation-scope
              enum: [anything/operation-scope, anything/alternate-scope]
              description: HTTPBin catch-all prefix used for the demo.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  default: Operation servers win
      responses:
        '200':
          $ref: '#/components/responses/EchoResponse'

  /anything/tour/reused/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identifier that demonstrates reusable-style path metadata.
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        example: reusable_123
    get:
      tags: [01 Tour/Reusable paths]
      summary: Resolve reusable parameter, response, and schema references
      operationId: getReusablePathItem
      description: |
        This route combines local `$ref` values for responses, headers, and schemas while its complete
        Path Item template is also preserved in `components.pathItems.ReusableEchoPath`.

        **Demonstrates:** internal reference resolution, derived bundled export, reusable parameter
        metadata, deep links, and source immutability. OpenDoc renders from a normalized semantic
        document while retaining the untouched original for download.
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/methods:
    get:
      tags: [01 Tour/HTTP methods]
      summary: GET method badge and request
      operationId: methodGet
      description: |
        Demonstrates a standard **GET** operation, method coloring, sidebar method filters, search,
        method statistics on Overview, and a body-free Runner request.
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
    post:
      tags: [01 Tour/HTTP methods]
      summary: POST method badge and request body
      operationId: methodPost
      description: |
        Demonstrates **POST**, JSON body generation, mock defaults, raw/form switching, and code
        snippets for a request with a payload.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: {type: string, default: create}
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
    put:
      tags: [01 Tour/HTTP methods]
      summary: PUT method badge and idempotent update
      operationId: methodPut
      description: |
        Demonstrates the **PUT** method color, operation discovery, generated snippets, and an
        idempotent-style JSON update payload.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                replace: {type: boolean, default: true}
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
    patch:
      tags: [01 Tour/HTTP methods]
      summary: PATCH method badge and merge patch
      operationId: methodPatch
      description: |
        Demonstrates **PATCH** and a vendor-specific structured body. OpenDoc recognizes
        `application/merge-patch+json` as JSON in the editor and response tooling.
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
            example:
              status: active
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
    delete:
      tags: [01 Tour/HTTP methods]
      summary: DELETE method badge
      operationId: methodDelete
      description: |
        Demonstrates **DELETE**, destructive-method coloring, compact method labels, method filters,
        and a successful response without a request body.
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
    head:
      tags: [01 Tour/HTTP methods]
      summary: HEAD response without a body
      operationId: methodHead
      description: |
        Demonstrates **HEAD** and the Runner response panel when only status and headers are expected.
        It is useful for checking how body-less transactions are stored in history.
      responses:
        '200':
          description: Headers only
          headers:
            X-Demo-Method:
              schema: {type: string}
              example: HEAD
    options:
      tags: [01 Tour/HTTP methods]
      summary: OPTIONS capability discovery
      operationId: methodOptions
      description: |
        Demonstrates **OPTIONS**, uncommon fixed-method badges, and response headers such as `Allow`.
      responses:
        '204':
          description: Capability metadata only
          headers:
            Allow:
              schema: {type: string}
              example: GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS
    trace:
      tags: [01 Tour/HTTP methods]
      summary: TRACE browser restriction edge case
      operationId: methodTrace
      deprecated: true
      description: |
        Demonstrates the **TRACE** operation in navigation and documentation. It is also marked
        `deprecated`, which exercises the deprecated badge and the **Hide deprecated endpoints**
        sidebar setting. Browser Fetch forbids TRACE for security reasons, so execution is expected to
        fail as a transport outcome that can still be inspected in OpenDoc's response panel and history.
      responses:
        '200':
          description: TRACE echo if the transport permits it
          content:
            message/http:
              schema: {type: string}
    query:
      tags: [01 Tour/HTTP methods]
      summary: Minimal OAS 3.2 QUERY badge
      operationId: methodQuery
      description: |
        Minimal **QUERY** Operation Object for method badges, search, routing, and compatibility.

        Prefer **00 Spotlight → Search the product catalog (QUERY)** for a body-rich RFC 10008 demo
        with named examples and SchemaViewer.

        > HTTPBin may reject QUERY; the failure is still useful in Response History.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                where: {type: string, example: status = "active"}
            example: {where: 'status = "active"'}
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
    additionalOperations:
      PURGE:
        tags: [01 Tour/HTTP methods]
        summary: OAS 3.2 additional PURGE operation
        operationId: methodPurge
        description: |
          Demonstrates OpenAPI 3.2 **`additionalOperations`** with an arbitrary `PURGE` method.
          OpenDoc exposes it through the same operation model used by fixed methods.

          Execution depends on browser and server support; documentation, deep linking, filtering,
          snippets, and compatibility analysis remain available regardless.
        responses:
          '204':
            description: Cache purged

  /anything/parameters/path/{simple}/{label}/{matrix}:
    get:
      tags: [02 Parameters/Path styles]
      summary: Exercise simple, label, and matrix path serialization
      operationId: serializePathStyles
      description: |
        ## Three path styles in one request

        Fill the Runner fields and inspect the substituted URL before sending.

        | Placeholder | Schema | Style | Example result |
        |---|---|---|---|
        | `simple` | string | `simple` | `blue` |
        | `label` | array | `label`, exploded | `.red.green` |
        | `matrix` | object | `matrix`, exploded | `;x=10;y=20` |

        **OpenDoc potential:** this makes serialization observable instead of hiding it behind a
        generic text box. Arrays are editable as chips, objects accept JSON, required path omissions
        are the one class of missing input that blocks execution, and generated code uses the same
        canonical request plan as the Runner.
      parameters:
        - name: simple
          in: path
          required: true
          description: A primitive path value using the OpenAPI default `simple` style.
          style: simple
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
            default: blue
        - name: label
          in: path
          required: true
          description: An array serialized with a leading dot and dot-separated exploded values.
          style: label
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 4
            items:
              type: string
              enum: [red, green, blue]
          example: [red, green]
        - name: matrix
          in: path
          required: true
          description: Enter a JSON object such as `{"x":10,"y":20}` to produce matrix segments.
          style: matrix
          explode: true
          schema:
            type: object
            properties:
              x: {type: integer, default: 10}
              y: {type: integer, default: 20}
          example: {x: 10, y: 20}
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '400': {$ref: '#/components/responses/ProblemResponse'}

  /anything/parameters/query:
    get:
      tags: [02 Parameters/Query styles]
      summary: Exercise every major query serialization style
      operationId: serializeQueryStyles
      description: |
        ## Query serialization laboratory

        This operation places several legal OpenAPI query representations side by side.

        - Repeated and compact **form arrays**.
        - `spaceDelimited` and `pipeDelimited` arrays.
        - `deepObject`, exploded object, and compact object forms.
        - `allowReserved` URL-like values with safe delimiter handling.
        - A content-based JSON parameter and multiple named examples.
        - Enum suggestions that remain permissive for negative testing.

        > Select documented values, then type an undocumented value. OpenDoc intentionally warns
        > where useful but does not over-police negative API tests.
      parameters:
        - name: tagsExploded
          in: query
          description: |
            Repeated query values (`?tagsExploded=alpha&tagsExploded=beta`).

            | Value | Meaning |
            |---|---|
            | `alpha` | First documented tag |
            | `beta` | Second documented tag |
            | `release` | Production release traffic |
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [alpha, beta, release]
          example: [alpha, beta]
        - name: tagsCompact
          in: query
          description: One comma-separated query value.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
          example: [one, two]
        - name: words
          in: query
          description: Space-delimited array serialization.
          style: spaceDelimited
          explode: false
          schema:
            type: array
            items: {type: string}
          example: [open, doc]
        - name: pipes
          in: query
          description: Pipe-delimited array serialization.
          style: pipeDelimited
          explode: false
          schema:
            type: array
            items: {type: string}
          example: [fast, clear, local]
        - name: filter
          in: query
          description: A deep-object filter; enter `{"status":"active","owner":"omid"}`.
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/SearchFilter'
          example: {status: active, owner: omid}
        - name: flatFilter
          in: query
          description: An object whose keys become independent query parameters.
          style: form
          explode: true
          schema:
            type: object
            properties:
              role: {type: string}
              region: {type: string}
          example: {role: admin, region: eu}
        - name: compactFilter
          in: query
          description: A compact object serialized as alternating comma-separated keys and values.
          style: form
          explode: false
          schema:
            type: object
            properties:
              role: {type: string}
              active: {type: boolean}
          example: {role: editor, active: true}
        - name: next
          in: query
          description: A URL-like value that exercises `allowReserved` without allowing query injection.
          allowReserved: true
          schema:
            type: string
            format: uri
          example: https://example.com/items?page=2&sort=name#results
        - name: payload
          in: query
          description: A content-based Parameter Object serialized as compact JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: array
                    items: {type: string}
                  dryRun: {type: boolean}
          example: {flags: [a, b], dryRun: true}
        - name: state
          in: query
          deprecated: true
          description: |
            A deprecated enum with descriptions extracted from this Markdown table.

            | Value | Case | Description |
            |---|---|---|
            | `active` | ACTIVE | Normal traffic |
            | `paused` | PAUSED | Temporarily suspended |
            | `archived` | ARCHIVED | Read-only historical data |
          schema:
            type: string
            enum: [active, paused, archived]
          examples:
            normal:
              summary: Normal traffic
              value: active
            suspended:
              summary: Suspended traffic
              value: paused
        - name: optionalEmpty
          in: query
          allowEmptyValue: true
          description: May be deliberately sent as an empty value.
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/parameters/headers-cookies:
    get:
      tags: [02 Parameters/Headers & cookies]
      summary: Serialize header arrays, objects, and cookie parameters
      operationId: serializeHeadersAndCookies
      description: |
        ## Header and cookie behavior

        **Header controls** demonstrate primitives, arrays, objects, patterns, examples, and a
        browser-controlled header. **Cookie parameters** deliberately trigger a Runner Compatibility
        browser finding because JavaScript cannot inject a raw `Cookie` header.

        - Custom headers are merged case-insensitively.
        - The browser may reject `Cookie`, `Host`, `Origin`, `Content-Length`, and other forbidden names.
        - Browser-managed cookies use `credentials: include` when the effective operation needs them.
        - The response history records network failures and diagnostics as first-class outcomes.
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - name: X-Regions
          in: header
          description: Comma-separated simple-style header array.
          style: simple
          explode: false
          schema:
            type: array
            items: {type: string, enum: [eu, us, ap]}
          example: [eu, us]
        - name: X-Filter
          in: header
          description: Exploded object header; enter a JSON object.
          style: simple
          explode: true
          schema:
            type: object
            properties:
              plan: {type: string}
              tier: {type: integer}
          example: {plan: pro, tier: 2}
        - name: Origin
          in: header
          description: Deliberately browser-controlled; used to surface a transport notice.
          schema: {type: string, format: uri}
          example: https://docs.example.com
        - name: preferences
          in: cookie
          description: Cookie object values are browser-managed in direct Runner mode.
          style: form
          explode: true
          schema:
            type: object
            properties:
              theme: {type: string, enum: [light, dark]}
              density: {type: string, enum: [compact, comfortable]}
          example: {theme: dark, density: compact}
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/parameters/merged/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [02 Parameters/Merging & OAS 3.2]
      summary: Merge path and operation parameters with an override
      operationId: mergeParameterLevels
      description: |
        ## Effective parameter resolution

        OpenDoc merges Path Item parameters with operation parameters by the `(name, in)` identity.
        The operation-level `locale` below replaces the reusable path-level version while
        `resourceId` remains inherited.

        Pair this endpoint with the next **OAS 3.2 query-string** operation: normal `query`
        parameters and a whole-query-string parameter are intentionally separated because the
        OpenAPI 3.2 contract forbids using both locations on the same operation.
      parameters:
        - name: locale
          in: query
          description: Operation override of the reusable Locale parameter.
          schema:
            type: string
            enum: [en-GB, fa-IR, nl-NL]
            default: nl-NL
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/parameters/querystring:
    get:
      tags: [02 Parameters/Merging & OAS 3.2]
      summary: Serialize one whole OAS 3.2 query-string parameter
      operationId: serializeWholeQueryString
      description: |
        ## Whole-query-string serialization

        OpenAPI 3.2 adds `in: querystring` for treating the entire query string as one value. The
        parameter must use `content`, may appear only once, and cannot coexist with ordinary
        `in: query` parameters on the same operation.

        This example uses `application/x-www-form-urlencoded`, so OpenDoc expands the object into
        top-level pairs such as `?cursor=next-123&include=owner`. It demonstrates 3.2 parsing,
        content-based parameter controls, canonical Runner planning, and generated snippets.
      parameters:
        - name: rawQuery
          in: querystring
          description: OAS 3.2 query-string object serialized into independent query pairs.
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  cursor: {type: string}
                  include: {type: string}
              encoding:
                include:
                  style: form
                  explode: false
          examples:
            compact:
              summary: OAS 3.2 data and serialized values
              dataValue: {cursor: next-123, include: owner}
              serializedValue: cursor=next-123&include=owner
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/bodies/rich:
    post:
      tags: [03 Request bodies/Rich JSON]
      summary: Edit a deeply typed recursive JSON form
      operationId: submitRichRequest
      description: |
        ## The main Runner form showcase

        Open this operation in **Split View** and compare the documentation matrix with the generated
        request form. The reusable `RichRequest` schema demonstrates:

        - `allOf` composition and inherited required properties.
        - Strings, numbers, integers, booleans, dates, date-times, formats, patterns, and `const`.
        - Defaults, examples, numeric bounds, `multipleOf`, and nullable type unions.
        - Arrays of primitives, arrays of objects, arrays of arrays, maps, add/remove/reorder controls.
        - Markdown field descriptions, schema links, external docs, and pattern testing.
        - `readOnly` omission from request mocks and `writeOnly` omission from response mocks.

        > Runner validation is deliberately permissive. Try violating a pattern or bound and inspect
        > the advisory notice; only an unresolved required path placeholder blocks execution.
      requestBody:
        $ref: '#/components/requestBodies/RichPayload'
      responses:
        '200':
          description: Echoed rich request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EchoEnvelope'
                  - type: object
                    properties:
                      received:
                        $ref: '#/components/schemas/RichRequest'
              examples:
                accepted:
                  summary: Accepted rich payload
                  value:
                    requestId: 123e4567-e89b-12d3-a456-426614174000
                    received:
                      title: OpenDoc showcase
                      mode: live
                      priority: 5
        '422': {$ref: '#/components/responses/ProblemResponse'}

  /anything/bodies/variants:
    post:
      tags: [03 Request bodies/Composition]
      summary: Switch among named oneOf command branches
      operationId: submitCustomerCommand
      description: |
        ## Selectable schema branches

        The request body uses `oneOf` with referenced branches. OpenDoc labels the choices from their
        schema names, generates branch-specific defaults, and keeps the edited branch selected.

        1. **CreateCustomer** — nested object with required fields.
        2. **LinkExistingCustomer** — a compact identifier command.
        3. **DeleteCustomerData** — a `const`-driven command.
        4. **null** — a pure-null branch rendered as real JSON `null`.

        The schema also declares a discriminator so raw OpenAPI inspection and downstream tooling can
        understand the intended polymorphism.
      requestBody:
        $ref: '#/components/requestBodies/CustomerCommandPayload'
      responses:
        '200':
          description: Command accepted
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Customer'
                  - $ref: '#/components/schemas/AsyncJob'
              examples:
                immediate:
                  summary: Immediate customer result
                  value: {id: cust_123, name: Ada Lovelace, status: active}
                queued:
                  summary: Queued asynchronous result
                  value: {id: job_123, state: queued, progress: 0}
        '400': {$ref: '#/components/responses/ProblemResponse'}

  /anything/bodies/media:
    post:
      tags: [03 Request bodies/Media types]
      summary: Switch raw editors across JSON, YAML, XML, text, HTML, and JavaScript
      operationId: submitMultipleMediaTypes
      description: |
        ## Media-aware body editing

        Use the content-type selector in the Runner. OpenDoc switches syntax highlighting and
        formatting rules without applying JSON validation to non-JSON text.

        | Media type | Expected editor behavior |
        |---|---|
        | `application/json` | Recursive form or JSON raw editor |
        | `application/vnd.opendoc+json` | Vendor JSON detection via `+json` |
        | `application/yaml` | YAML parsing and formatting |
        | `application/xml` | XML raw editing |
        | `text/plain` | Unconstrained plain text |
        | `text/html` | HTML highlighting |
        | `application/javascript` | JavaScript highlighting |

        This operation also references an OAS 3.2 reusable **Media Type Object**.
      requestBody:
        required: true
        description: Choose a media type to demonstrate mode and language selection.
        content:
          application/json:
            $ref: '#/components/mediaTypes/DemoJson'
          application/vnd.opendoc+json:
            schema:
              $ref: '#/components/schemas/FreeFormObject'
            example: {vendor: opendoc, enabled: true}
          application/yaml:
            schema:
              $ref: '#/components/schemas/FreeFormObject'
            example: |
              product: OpenDoc UI
              features:
                - docs
                - runner
                - ai
          application/xml:
            schema:
              $ref: '#/components/schemas/XmlMessage'
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <message><title>OpenDoc UI</title><enabled>true</enabled></message>
          text/plain:
            schema: {type: string}
            example: Exact plain-text payload — JSON rules do not apply.
          text/html:
            schema: {type: string}
            example: '<article><h1>OpenDoc UI</h1><p>HTML body demo</p></article>'
          application/javascript:
            schema: {type: string}
            example: 'export const product = "OpenDoc UI";'
      responses:
        '200':
          description: Echo in several representational formats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EchoEnvelope'}
            application/yaml:
              schema: {$ref: '#/components/schemas/EchoEnvelope'}
            application/xml:
              schema: {$ref: '#/components/schemas/XmlMessage'}
            text/plain:
              schema: {type: string}

  /anything/bodies/forms:
    post:
      tags: [03 Request bodies/Forms & files]
      summary: Build URL-encoded and multipart forms with files
      operationId: submitFormsAndFiles
      description: |
        ## Browser-native form transports

        Toggle between `application/x-www-form-urlencoded` and `multipart/form-data`.

        - URL-encoded arrays become repeated or styled key/value pairs.
        - Multipart uses browser `FormData`; OpenDoc removes an explicit multipart `Content-Type` so
          the browser can add the required boundary.
        - Binary schema fields become file pickers with drag-and-drop support.
        - Encoding `contentType`, `style`, and `explode` influence individual parts.
        - Custom per-part headers are documented but produce a **partial compatibility** finding,
          because browser FormData cannot emit arbitrary part headers.

        > This endpoint is intentionally both useful and imperfect: it shows users exactly where the
        > browser transport boundary is instead of pretending all multipart metadata is executable.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormSubmission'
            encoding:
              tags:
                style: form
                explode: true
              metadata:
                contentType: application/json
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MultipartSubmission'
            encoding:
              metadata:
                contentType: application/json
                headers:
                  X-Part-Signature:
                    description: Demonstration-only custom part header.
                    schema: {type: string}
              tags:
                style: form
                explode: true
              attachment:
                contentType: application/octet-stream
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '413':
          description: Payload too large
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /anything/bodies/binary:
    put:
      tags: [03 Request bodies/Forms & files]
      summary: Upload a top-level binary request body
      operationId: uploadBinaryBody
      description: |
        ## Top-level file upload

        A `string` with `format: binary` becomes a file picker rather than a text field. OpenDoc sends
        the selected `File`/`Blob` using the declared media type and generates transport-appropriate
        snippets without inventing a raw multipart boundary.

        **Try:** select a small file, save Runner inputs, clear the form, and compare what persists.
        Browser file handles are intentionally not serialized as ordinary local state.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Any small demonstration file.
          image/png:
            schema:
              type: string
              contentEncoding: binary
              contentMediaType: image/png
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/bodies/recursive:
    post:
      tags: [03 Request bodies/Recursion]
      summary: Render a recursive tree without overflowing
      operationId: submitRecursiveTree
      description: |
        ## Cycle-safe schema handling

        `TreeNode.children.items` points back to `TreeNode`. OpenDoc expands useful properties, marks
        recursive/reused branches with a loop icon, and stops at the cycle boundary.

        This endpoint is useful for demonstrating that recursion safety is shared across:

        - Documentation property matrices.
        - Schema modals and Schema Explorer.
        - Generated examples and typed defaults.
        - Recursive Runner forms.
        - TypeScript model generation.

        Switch to **Raw** mode when you want to author a deeper recursive value manually.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TreeNode'}
            example:
              id: root
              label: Root node
              children:
                - id: child-1
                  label: First child
                  children: []
      responses:
        '200':
          description: Echoed tree
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TreeNode'}

  /anything/examples/items:
    get:
      tags: [04 Responses/Examples & formats]
      summary: Compare named JSON, YAML, and XML response examples with oneOf details
      operationId: getExampleGalleryItem
      description: |
        ## Multi-format named response examples

        This endpoint is designed to demonstrate the full example surface of OpenDoc UI:

        - **Generated Example** for schema-derived payloads.
        - A dedicated **Example: ...** tab for named OpenAPI `examples`.
        - Inline `oneOf` branch picking inside JSON, YAML, and XML example renderings.
        - Multi-format switching without losing the active schema understanding.
        - **View Schema** from the same tab row.

        Use the `details` field to compare how inline and reusable branch schemas read across
        representational formats.
      responses:
        '200':
          description: Example-rich item response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
              examples:
                jsonBook:
                  $ref: '#/components/examples/ShowcaseBookJsonExample'
                jsonElectronic:
                  $ref: '#/components/examples/ShowcaseElectronicJsonExample'
                jsonApparel:
                  $ref: '#/components/examples/ShowcaseApparelJsonExample'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
              examples:
                yamlBook:
                  $ref: '#/components/examples/ShowcaseBookYamlExample'
                yamlElectronic:
                  $ref: '#/components/examples/ShowcaseElectronicYamlExample'
                yamlApparel:
                  $ref: '#/components/examples/ShowcaseApparelYamlExample'
            application/xml:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
              examples:
                xmlBook:
                  $ref: '#/components/examples/ShowcaseBookXmlExample'
                xmlElectronic:
                  $ref: '#/components/examples/ShowcaseElectronicXmlExample'
                xmlApparel:
                  $ref: '#/components/examples/ShowcaseApparelXmlExample'

    post:
      tags: [03 Request bodies/Examples & formats, 03 Request bodies/Composition]
      summary: Submit multi-format named request examples with oneOf details
      operationId: createExampleGalleryItem
      description: |
        ## Multi-format named request examples

        This request body is intentionally simple but powerful for demos:

        - The same schema is available as JSON, YAML, and XML.
        - Each media type declares three named OpenAPI `examples`.
        - The `details` property uses `oneOf`, so generated examples, schema tables, and generated
          code all have something meaningful to switch between.
        - The response echoes the same concept back with reusable detail models.

        Try moving between **Generated Example**, **Unified Schema**, and **Example: ...** tabs while
        switching both media type and `oneOf` branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowcaseItemRequest'
            examples:
              jsonBook:
                $ref: '#/components/examples/ShowcaseBookJsonExample'
              jsonElectronic:
                $ref: '#/components/examples/ShowcaseElectronicJsonExample'
              jsonApparel:
                $ref: '#/components/examples/ShowcaseApparelJsonExample'
          application/yaml:
            schema:
              $ref: '#/components/schemas/ShowcaseItemRequest'
            examples:
              yamlBook:
                $ref: '#/components/examples/ShowcaseBookYamlExample'
              yamlElectronic:
                $ref: '#/components/examples/ShowcaseElectronicYamlExample'
              yamlApparel:
                $ref: '#/components/examples/ShowcaseApparelYamlExample'
          application/xml:
            schema:
              $ref: '#/components/schemas/ShowcaseItemRequest'
            examples:
              xmlBook:
                $ref: '#/components/examples/ShowcaseBookXmlExample'
              xmlElectronic:
                $ref: '#/components/examples/ShowcaseElectronicXmlExample'
              xmlApparel:
                $ref: '#/components/examples/ShowcaseApparelXmlExample'
      responses:
        '201':
          description: Created example item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
              examples:
                jsonBook:
                  $ref: '#/components/examples/ShowcaseBookJsonExample'
                jsonElectronic:
                  $ref: '#/components/examples/ShowcaseElectronicJsonExample'
                jsonApparel:
                  $ref: '#/components/examples/ShowcaseApparelJsonExample'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
              examples:
                yamlBook:
                  $ref: '#/components/examples/ShowcaseBookYamlExample'
                yamlElectronic:
                  $ref: '#/components/examples/ShowcaseElectronicYamlExample'
                yamlApparel:
                  $ref: '#/components/examples/ShowcaseApparelYamlExample'
            application/xml:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
              examples:
                xmlBook:
                  $ref: '#/components/examples/ShowcaseBookXmlExample'
                xmlElectronic:
                  $ref: '#/components/examples/ShowcaseElectronicXmlExample'
                xmlApparel:
                  $ref: '#/components/examples/ShowcaseApparelXmlExample'

  /anything/responses/gallery:
    get:
      tags: [04 Responses/Status gallery]
      summary: Browse response codes, media types, headers, schemas, and examples
      operationId: responseGallery
      description: |
        ## Response documentation stress test

        This operation is designed for OpenDoc's vertical response-code navigator and deep links.

        - Success, redirect, client-error, server-error, status-range, and `default` entries.
        - Multiple media types and named examples on one response.
        - Reusable response and header components.
        - Example, schema, and enum-oriented response tabs.
        - Response sharing through `#response-<code>` URLs.
        - Keyboard response navigation with **Ctrl/⌘ + Arrow Up/Down**.

        > Collapse several responses, deep-link to `422`, reload, and use Back/Forward to demonstrate
        > URL-authoritative workspace restoration.
      parameters:
        - name: scenario
          in: query
          description: Select which conceptual response the demo server should represent.
          schema:
            type: string
            enum: [success, created, redirect, validation, rate-limit, failure]
            default: success
      responses:
        '200':
          description: Successful response with several representations
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            X-RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerPage'}
              examples:
                populated:
                  summary: Two customers
                  description: A normal paginated result.
                  value:
                    items:
                      - {id: cust_1, name: Ada Lovelace, status: active}
                      - {id: cust_2, name: Grace Hopper, status: paused}
                    page: 1
                    pageSize: 20
                    total: 2
                empty:
                  summary: Empty page
                  value: {items: [], page: 1, pageSize: 20, total: 0}
                oas32DataValue:
                  summary: OpenAPI 3.2 Example Object using dataValue
                  dataValue: {items: [], page: 2, pageSize: 20, total: 0}
                  serializedValue: '{"items":[],"page":2,"pageSize":20,"total":0}'
            application/xml:
              schema: {$ref: '#/components/schemas/CustomerPage'}
            application/yaml:
              schema: {$ref: '#/components/schemas/CustomerPage'}
            text/plain:
              schema: {type: string}
              example: 2 customers found
          links:
            getFirstCustomer:
              operationId: getLinkedResource
              parameters:
                id: '$response.body#/items/0/id'
              description: Follow the first returned customer ID.
        '201':
          description: Resource created
          headers:
            Location:
              description: URL of the new resource.
              schema: {type: string, format: uri}
              example: https://api.example.com/customers/cust_123
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '204':
          $ref: '#/components/responses/NoContent'
        '302':
          description: Temporary redirect
          headers:
            Location:
              description: Redirect destination.
              required: true
              schema: {type: string, format: uri}
              example: https://example.com/new-location
        '206':
          description: Enum-only partial status response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowState'}
              example: running
        '400': {$ref: '#/components/responses/ProblemResponse'}
        '401':
          description: Missing or invalid credentials
          headers:
            WWW-Authenticate:
              schema: {type: string}
              example: Bearer realm="opendoc-demo"
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Validation failure with field details
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ValidationProblem'}
              examples:
                titleRequired:
                  summary: Missing title
                  value:
                    type: https://example.com/problems/validation
                    title: Request validation failed
                    status: 422
                    errors:
                      - {pointer: /title, code: required, message: Title is required}
                modeInvalid:
                  summary: Unsupported mode
                  value:
                    type: https://example.com/problems/validation
                    title: Request validation failed
                    status: 422
                    errors:
                      - {pointer: /mode, code: enum, message: Mode is not documented}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '4XX':
          description: Other client-error status range
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '5XX':
          description: Server error status range
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default:
          description: Any response not covered above
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FreeFormObject'}

  /anything/responses/enum:
    get:
      tags: [04 Responses/Status gallery]
      summary: Show an enum response and Markdown case descriptions
      operationId: getWorkflowState
      description: |
        The success schema is a reusable enum whose Markdown table documents every case. Use this to
        demonstrate enum presentation in Documentation, rich dropdown descriptions in Runner fields,
        schema search, and TypeScript union generation.
      responses:
        '200':
          description: Current workflow state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowState'}
              examples:
                queued: {value: queued}
                running: {value: running}
                finished: {value: succeeded}

  /status/204:
    get:
      tags: [04 Responses/Status gallery]
      summary: Receive a real no-content response
      operationId: getNoContent
      description: |
        HTTPBin returns a real **204**. The Runner should show status, timing, URL, timestamp, and
        headers without pretending a structured payload exists. The transaction remains available in
        persistent response history.
      responses:
        '204': {$ref: '#/components/responses/NoContent'}

  /bytes/{size}:
    get:
      tags: [04 Responses/Binary & streaming]
      summary: Detect a declared binary response and cancel its body stream
      operationId: getBinaryBytes
      description: |
        ## Safe binary behavior

        OpenDoc sends the request but does **not** automatically download or buffer binary data. When
        the OpenAPI response or actual headers indicate binary/attachment content, it cancels the body
        stream after headers and displays metadata instead.

        Demonstrates:

        - `application/octet-stream` plus `format: binary`.
        - `Content-Disposition` and `Content-Length` response headers.
        - Binary findings and the special **A · 95** compatibility score.
        - No browser download event and bounded persistent history.
      parameters:
        - name: size
          in: path
          required: true
          description: Number of random bytes requested from HTTPBin.
          schema:
            type: integer
            minimum: 1
            maximum: 65536
            default: 64
      responses:
        '200':
          description: Random binary bytes — metadata only in OpenDoc
          headers:
            Content-Length:
              description: Declared payload size.
              schema: {type: integer}
            Content-Disposition:
              description: Optional attachment metadata.
              schema: {type: string}
              example: attachment; filename="demo.bin"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '416': {$ref: '#/components/responses/ProblemResponse'}

  /delay/{seconds}:
    get:
      tags: [04 Responses/Binary & streaming]
      summary: Cancel a slow request or observe the 30-second timeout
      operationId: delayedResponse
      description: |
        Start this request and press **Cancel** before it finishes. OpenDoc records cancellation,
        timeout, network error, validation failure, and HTTP response outcomes in the same bounded
        transaction history model.

        - User cancellation produces `cancelled`.
        - The Runner timeout is 30 seconds.
        - Switching endpoints or unmounting the Runner aborts an in-flight request safely.
        - Response history keeps the last ten outcomes per specification + method + path.
      parameters:
        - name: seconds
          in: path
          required: true
          description: Delay requested from HTTPBin; use `5` for a comfortable cancellation demo.
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 5
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '504': {$ref: '#/components/responses/ProblemResponse'}

  /status/418:
    get:
      tags: [07 Compatibility/Browser limits]
      summary: Declare no successful response
      operationId: noDeclaredSuccess
      description: |
        This deliberately unusual contract declares only **418**. OpenDoc can still run it, but the
        compatibility report assigns a partial finding because no `2xx` or `default` response exists
        from which to pre-classify a successful payload.

        Use it to explain the distinction between **static specification analysis** and the real
        server response, whose headers remain authoritative.
      responses:
        '418':
          description: I am a teapot
          content:
            text/plain:
              schema: {type: string}
              example: '-=[ teapot ]=-'

  /anything/security/public:
    get:
      tags: [05 Security/Public & HTTP]
      summary: Explicitly public operation
      operationId: publicSecurityOverride
      description: |
        `security: []` explicitly disables inherited requirements. Configure a token globally, run
        this operation, and inspect generated snippets: OpenDoc must not leak or apply credentials to
        an operation whose effective security is public.
      security: []
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/security/bearer:
    get:
      tags: [05 Security/Public & HTTP]
      summary: Apply an HTTP Bearer token
      operationId: bearerProtectedOperation
      description: |
        Demonstrates a protected indicator, the per-spec authorization modal, a named Bearer scheme,
        JWT formatting hints, authorization state coloring, redacted AI context, and credential-safe
        generated snippets.
      security:
        - BearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '401': {$ref: '#/components/responses/ProblemResponse'}

  /anything/security/basic:
    get:
      tags: [05 Security/Public & HTTP]
      summary: Apply HTTP Basic authentication
      operationId: basicProtectedOperation
      description: |
        Demonstrates username/password controls and an RFC 7617 `Authorization: Basic …` request.
        Secrets remain scoped to this specification and are replaced with placeholders in generated
        examples rather than copied into exportable code.
      security:
        - BasicAuth: []
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '401': {$ref: '#/components/responses/ProblemResponse'}

  /anything/security/api-keys:
    get:
      tags: [05 Security/API keys]
      summary: Require header and query API keys together
      operationId: composedApiKeyRequirement
      description: |
        A single Security Requirement Object means **AND**: both `HeaderApiKey` and `QueryApiKey`
        must be configured and applied simultaneously. OpenDoc preserves their real scheme IDs,
        reports incomplete authorization, and serializes each credential into its declared location.
      security:
        - HeaderApiKey: []
          QueryApiKey: []
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '403': {$ref: '#/components/responses/ProblemResponse'}

  /anything/security/alternatives:
    get:
      tags: [05 Security/API keys]
      summary: Choose among OR security alternatives including anonymous access
      operationId: alternativeSecurityRequirements
      description: |
        Separate Security Requirement Objects mean **OR**. The authorization modal presents each
        alternative independently:

        1. Bearer token.
        2. Header API key.
        3. OAuth scope.
        4. Anonymous `{}` access.

        The anonymous alternative is important: a lock icon must not imply that credentials are
        mandatory when the contract explicitly permits public access.
      security:
        - BearerAuth: []
        - HeaderApiKey: []
        - OAuth2: [demo:read]
        - {}
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/security/cookie:
    get:
      tags: [05 Security/API keys]
      summary: Use a browser-managed session cookie
      operationId: cookieProtectedOperation
      description: |
        Cookie API-key schemes are transport-dependent in a browser. OpenDoc shows one informational
        authorization note, uses `credentials: include`, and does not claim it can inject a manual
        `Cookie` header.

        This endpoint should receive a **browser-limited (B)** compatibility classification.
      security:
        - CookieSession: []
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '401': {$ref: '#/components/responses/ProblemResponse'}

  /anything/security/oauth:
    get:
      tags: [05 Security/OAuth & OIDC]
      summary: Discover OAuth 2 authorization code with PKCE
      operationId: oauthProtectedOperation
      description: |
        The OAuth scheme declares authorization-code, implicit, client-credentials, and password
        flows. OpenDoc can discover the browser authorization flow, collect a client ID and scopes,
        construct PKCE (`S256`), validate `state`, and exchange a returned code when the token endpoint
        permits browser CORS.

        The URLs are documentation-only examples; do not expect the placeholder identity server to
        complete a real login.
      security:
        - OAuth2: [demo:read, profile]
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '401': {$ref: '#/components/responses/ProblemResponse'}

  /anything/security/oidc:
    get:
      tags: [05 Security/OAuth & OIDC]
      summary: Supply an OpenID Connect access token
      operationId: oidcProtectedOperation
      description: |
        Demonstrates an `openIdConnect` security scheme and manual Bearer-token execution. OpenDoc
        preserves the discovery URL in the specification while keeping request execution explicit and
        credentials spec-scoped.
      security:
        - OpenIdConnect: [openid, profile]
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  /anything/security/mtls:
    get:
      tags: [05 Security/OAuth & OIDC]
      summary: Document browser-managed mutual TLS
      operationId: mutualTlsOperation
      description: |
        Client-certificate selection is controlled by the browser and operating system, not by a
        JavaScript API client. OpenDoc documents the `mutualTLS` scheme and reports the transport
        dependency rather than presenting a fake certificate field.
      security:
        - MutualTLS: []
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}
        '401': {$ref: '#/components/responses/ProblemResponse'}

  /anything/events/jobs:
    post:
      tags: [06 Events/Callbacks & links]
      summary: Create a job with a provider callback
      operationId: createAsyncJob
      description: |
        ## Callback-aware operation

        The primary POST is runnable, while the callback operation is initiated later by the API
        provider. OpenDoc's compatibility report identifies callback operations as documentation-only
        for the outbound Runner.

        The callback URL is taken from `$request.body#/callbackUrl`, and the `202` response includes a
        Link Object to `getLinkedResource`. This makes the specification useful for AI-grounded workflow
        explanations even though OpenDoc does not pretend to host callback receivers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            example:
              task: export-customer-data
              callbackUrl: https://client.example.com/hooks/jobs
      callbacks:
        jobStatusChanged:
          '{$request.body#/callbackUrl}':
            post:
              summary: Receive a job status update
              operationId: receiveJobStatus
              requestBody:
                required: true
                content:
                  application/json:
                    schema: {$ref: '#/components/schemas/AsyncJob'}
              responses:
                '204':
                  description: Callback accepted
      responses:
        '202':
          description: Job queued
          headers:
            Location:
              schema: {type: string, format: uri}
              example: https://api.example.com/jobs/job_123
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncJob'}
              example: {id: job_123, state: queued, progress: 0}
          links:
            getJob:
              operationId: getLinkedResource
              parameters:
                id: '$response.body#/id'
              description: Open the newly created job resource.
        '400': {$ref: '#/components/responses/ProblemResponse'}

  /anything/events/linked/{id}:
    get:
      tags: [06 Events/Callbacks & links]
      summary: Resolve a response Link Object target
      operationId: getLinkedResource
      description: |
        A small target operation for Link Objects declared elsewhere in the spec. Search by the shared
        `operationId`, open both endpoints in permanent tabs, and demonstrate how OpenDoc's workspace,
        AI context, and deep links help users follow contract-level relationships.
      parameters:
        - name: id
          in: path
          required: true
          description: Linked resource identifier.
          schema: {type: string}
          example: job_123
      responses:
        '200':
          description: Linked resource
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AsyncJob'
                  - $ref: '#/components/schemas/Customer'

  /anything/compatibility/get-body:
    get:
      tags: [07 Compatibility/Browser limits]
      summary: Document a GET request body that browser Fetch must omit
      operationId: getWithBody
      description: |
        OpenAPI can describe this unusual GET body, but browser Fetch does not permit sending it.
        OpenDoc therefore keeps the body visible in documentation, omits it from the materialized
        browser request, and emits a precise transport diagnostic.

        This endpoint is deliberately included to make the compatibility report explain a real
        limitation instead of silently failing or blocking the entire operation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                diagnostic: {type: string, default: browser-body-test}
      responses:
        '200': {$ref: '#/components/responses/EchoResponse'}

  # ─── 00 Spotlight — flagship OpenDoc UI moments ─────────────────
  /anything/spotlight/catalog:
    post:
      tags: [00 Spotlight]
      summary: Draft a catalog item with field combinators
      operationId: draftCatalogItem
      description: |
        ## The SchemaViewer flagship

        Open **Documentation** first. The request body is a single **SchemaViewer**:

        1. **Meta header** — name, type, media, combinator badges (always open).
        2. **Generated Example** — switch JSON / YAML / XML / form encodings; inline **oneOf** carets on fields.
        3. **Unified Schema** — property table with the same field menus.
        4. **Example:** tab — named OpenAPI `examples` without leaving the viewer.

        ### Field-level combinators to try

        | Field | Keyword | Try this |
        |---|---|---|
        | `payment` | **oneOf** | Exclusive Card vs Wire vs Store credit — caret in the example updates the mock |
        | `fulfillment` | **anyOf** | Multi-select merge; **All** on/off (empty = none) |
        | `identity` | **allOf** | Focus a composition part — sibling keys and code lines dim |
        | `marker` | **not** | Inspection only (no exclusive collapse) |

        Then open **Split View** and send to HTTPBin — the Runner form follows the same branch state.

        > Search for `combinator` or `catalog` from **Ctrl/⌘ + K** to jump back here later.
      externalDocs:
        description: OpenAPI Schema Object
        url: https://spec.openapis.org/oas/v3.2.0.html#schema-object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItem'
            examples:
              cardCheckout:
                summary: Card payment · ship home
                value:
                  sku: SKU-1001
                  title: OpenDoc field guide
                  payment:
                    method: card
                    brand: visa
                    last4: '4242'
                  fulfillment:
                    - mode: ship
                      carrier: dhl
                    - mode: email
                      address: reader@example.com
                  identity:
                    displayName: Ada Lovelace
                    email: ada@example.com
                  notes: Gift wrap
              wirePickup:
                summary: Wire transfer · store pickup
                value:
                  sku: SKU-2048
                  title: Combinator poster
                  payment:
                    method: wire
                    iban: DE89370400440532013000
                    reference: INV-77
                  fulfillment:
                    - mode: pickup
                      storeId: store_ams_01
                  identity:
                    displayName: Guest
                    email: guest@example.com
          application/yaml:
            schema:
              $ref: '#/components/schemas/CatalogItem'
            example: |
              sku: SKU-1001
              title: OpenDoc field guide
              payment:
                method: card
                brand: visa
                last4: "4242"
      responses:
        '200':
          description: Echoed catalog draft (HTTPBin wraps the body)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EchoEnvelope'
                  - type: object
                    properties:
                      json:
                        $ref: '#/components/schemas/CatalogItem'
              examples:
                accepted:
                  summary: Accepted draft echo
                  value:
                    json:
                      sku: SKU-1001
                      title: OpenDoc field guide
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          description: Validation failure with field details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                missingPayment:
                  summary: Payment branch incomplete
                  value:
                    type: https://example.com/problems/validation
                    title: Request validation failed
                    status: 422
                    errors:
                      - {pointer: /payment/last4, code: required, message: Card last4 is required}

  /anything/spotlight/search:
    query:
      tags: [00 Spotlight]
      summary: Search the product catalog (QUERY)
      operationId: searchProductCatalog
      description: |
        ## OAS 3.2 QUERY · RFC 10008

        **QUERY** is safe and idempotent like GET, but carries a **structured body** like POST.
        OpenDoc treats it as a first-class method:

        - Sidebar method badge and global search
        - Documentation request body via the same **SchemaViewer** as POST
        - Runner sends QUERY with JSON when the browser allows it
        - GET/HEAD body warnings stay strict — QUERY is the intentional exception

        ### Try

        1. Expand the body SchemaViewer — filters object, sort array, pagination.
        2. Switch the named **Example:** (shoes vs electronics).
        3. **Send** — HTTPBin may reject QUERY; inspect the transport outcome and history anyway.
        4. Compare with **01 Tour/HTTP methods → Minimal OAS 3.2 QUERY badge** (badge-only).

        ```http
        QUERY /anything/spotlight/search HTTP/1.1
        Content-Type: application/json

        {"filter":{"category":"shoes","maxPrice":120},"limit":20}
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearch'
            examples:
              shoes:
                summary: Shoes under €120
                value:
                  filter:
                    category: shoes
                    maxPrice: 120
                    inStock: true
                  sort: [price_asc, name]
                  limit: 20
                  cursor: null
              electronics:
                summary: Electronics · rating floor
                value:
                  filter:
                    category: electronics
                    minRating: 4
                  sort: [rating_desc]
                  limit: 10
      responses:
        '200':
          description: Matching products (or HTTPBin echo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
              examples:
                page:
                  summary: First page
                  value:
                    items:
                      - {id: prod_1, name: Trail runner, price: 89.0, category: shoes}
                      - {id: prod_2, name: City sneaker, price: 110.0, category: shoes}
                    nextCursor: eyJvZmZzZXQiOjIwfQ
                    total: 48
        '400': {$ref: '#/components/responses/ProblemResponse'}

  /anything/spotlight/bare-ref:
    put:
      tags: [00 Spotlight]
      summary: Edit a bare $ref combinator body
      operationId: putBareRefCommand
      description: |
        ## Bare `$ref` → same rails

        The media type schema is **only** `{$ref: '#/components/schemas/CustomerCommand'}`.
        There is no inline `oneOf` keyword on the media object.

        OpenDoc still surfaces body-level **oneOf** rails (Create / Link / Delete / null) because the
        resolved target is a combinator. This is the “generator emitted a ref, not a keyword” case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCommand'
            examples:
              create:
                summary: Create customer
                value:
                  kind: create
                  name: Ada Lovelace
                  email: ada@example.com
                  address:
                    line1: Damrak 1
                    city: Amsterdam
                    postalCode: 1012 LG
                    countryCode: NL
      responses:
        '200':
          description: Command accepted
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Customer'
                  - $ref: '#/components/schemas/AsyncJob'
        '400': {$ref: '#/components/responses/ProblemResponse'}

  /anything/spotlight/offer:
    get:
      tags: [00 Spotlight]
      summary: Read a multi-format polymorphic offer
      operationId: getSpotlightOffer
      description: |
        ## Responses share SchemaViewer too

        Expand the **200** response:

        - **Format** switches `application/json` vs `application/yaml` vs `application/xml`
        - **Generated Example** follows the active **oneOf** branch on `details`
        - **Example:** tab holds named vendor examples
        - **Unified Schema** is the same property table as the request side

        Use the response code navigator (desktop rail / mobile pill) and deep-link `#response-200`.
      responses:
        '200':
          description: Catalog offer with polymorphic details
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag:
              description: Strong validator for conditional requests.
              schema: {type: string}
              example: '"offer-v3"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
              examples:
                book:
                  summary: Book offer
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174000
                    name: OpenAPI field guide
                    details: {format: hardcover, pages: 420}
                gadget:
                  summary: Electronics offer
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174001
                    name: USB-C hub
                    details: {voltage: 5, wattage: 100}
            application/yaml:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
              example: |
                id: 123e4567-e89b-12d3-a456-426614174000
                name: OpenAPI field guide
                details:
                  format: hardcover
                  pages: 420
            application/xml:
              schema:
                $ref: '#/components/schemas/ShowcaseItemResponseReusable'
        '304':
          description: Not modified
          headers:
            ETag:
              schema: {type: string}
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '406':
          description: No acceptable representation
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /anything/spotlight/profile:
    patch:
      tags: [00 Spotlight]
      summary: Patch a profile assembled with allOf
      operationId: patchSpotlightProfile
      description: |
        ## allOf as a unified object

        The body is an **allOf** of `UserProfile` + marketing preferences + audit stamp — not a choice
        among parts. OpenDoc leads with the **combined** object (required list beside the keyword),
        names the parts underneath, and still lets you **focus** a part so unrelated keys dim in the
        example and table.

        Empty / conflicting allOf samples live under Schema Explorer (`ConflictingAllOf`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotlightProfilePatch'
            example:
              id: user_42
              displayName: Original Developer
              address:
                line1: Damrak 1
                city: Amsterdam
                postalCode: 1012 LG
                countryCode: NL
              roles: [editor]
              marketingOptIn: true
              locale: en-GB
              patchNote: Prefer dark theme defaults
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotlightProfilePatch'
        '400': {$ref: '#/components/responses/ProblemResponse'}

webhooks:
  paymentSettled:
    post:
      tags: [06 Events/Webhooks]
      summary: Receive a settled payment event
      operationId: webhookPaymentSettled
      description: |
        Provider-initiated webhook shown on the Overview page. It is documentation-only in the
        outbound Runner but remains available to the parser, schema tooling, AI context, and exports.
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          description: HMAC signature supplied by the provider.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, paymentId, amount]
              properties:
                eventId: {type: string, format: uuid}
                paymentId: {type: string}
                amount: {$ref: '#/components/schemas/Money'}
      responses:
        '204':
          description: Event accepted
  customerLifecycle:
    post:
      tags: [06 Events/Webhooks]
      summary: Receive a customer lifecycle event
      operationId: webhookCustomerLifecycle
      description: Demonstrates a second webhook card and a polymorphic event payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: CustomerCreatedEvent
                  required: [type, customer]
                  properties:
                    type: {const: customer.created}
                    customer: {$ref: '#/components/schemas/Customer'}
                - type: object
                  title: CustomerDeletedEvent
                  required: [type, customerId]
                  properties:
                    type: {const: customer.deleted}
                    customerId: {type: string}
      responses:
        '202':
          description: Event queued

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Paste a short-lived **Bearer token**. OpenDoc scopes credentials to this specification,
        redacts them from AI context, and uses placeholders in code generation.
    BasicAuth:
      type: http
      scheme: basic
      description: Username and password encoded according to RFC 7617.
    HeaderApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key sent in a custom header.
    QueryApiKey:
      type: apiKey
      in: query
      name: api_key
      description: API key appended as a query parameter.
    CookieSession:
      type: apiKey
      in: cookie
      name: opendoc_session
      description: Browser-managed session cookie; JavaScript cannot inject the raw Cookie header.
    OAuth2:
      type: oauth2
      description: Demonstration OAuth 2 scheme with all standard flows.
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.com/oauth/authorize
          tokenUrl: https://identity.example.com/oauth/token
          refreshUrl: https://identity.example.com/oauth/refresh
          scopes:
            demo:read: Read demonstration resources
            demo:write: Modify demonstration resources
            profile: Read the current profile
        implicit:
          authorizationUrl: https://identity.example.com/oauth/authorize
          scopes:
            demo:read: Read demonstration resources
        clientCredentials:
          tokenUrl: https://identity.example.com/oauth/token
          scopes:
            demo:admin: Administer demonstration resources
        password:
          tokenUrl: https://identity.example.com/oauth/token
          scopes:
            legacy: Demonstration-only legacy scope
    OpenIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.com/.well-known/openid-configuration
      description: OpenID Connect discovery document; Runner accepts a manually supplied access token.
    MutualTLS:
      type: mutualTLS
      description: Client certificate selection remains browser/OS managed.

  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: |
        Optional distributed-tracing identifier.

        - Pattern testing is available from the field metadata.
        - Invalid values remain sendable for negative testing.
      schema:
        type: string
        pattern: '^[A-Fa-f0-9]{16,32}$'
      example: 4bf92f3577b34da6a3ce929d0e0e4736
    TenantPath:
      name: tenant
      in: path
      required: true
      description: Tenant slug used in the substituted route.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{1,31}$'
        default: acme
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: Stable resource ID shared at Path Item level.
      schema:
        type: string
        pattern: '^[a-z]+_[A-Za-z0-9]+$'
      example: item_123
    Locale:
      name: locale
      in: query
      required: false
      description: Reusable locale that is overridden on one operation.
      schema:
        type: string
        enum: [en-US, fa-IR]
        default: en-US
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    RequestId:
      description: Correlation identifier assigned by the server.
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000
    RateLimitLimit:
      description: Maximum requests in the current window.
      schema: {type: integer, minimum: 0}
      example: 1000
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema: {type: integer, minimum: 0}
      example: 999
    RetryAfter:
      description: Seconds before another attempt.
      schema: {type: integer, minimum: 1}
      example: 30

  responses:
    HelloResponse:
      description: Friendly echo response
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HelloMessage'}
          examples:
            default:
              summary: Default greeting
              value:
                message: Hello from OpenDoc UI
                product: OpenDoc UI
                capabilities: [documentation, runner, schemas, notes, ai]
    EchoResponse:
      description: Request details echoed by the demonstration server
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EchoEnvelope'}
          examples:
            basic:
              summary: Basic echo envelope
              value:
                requestId: 123e4567-e89b-12d3-a456-426614174000
                method: GET
                url: https://httpbin.org/anything/example
                headers: {Accept: application/json}
                query: {demo: 'true'}
                body: null
    ProblemResponse:
      description: RFC 9457-style problem details
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            badRequest:
              summary: Bad request
              value:
                type: https://example.com/problems/bad-request
                title: Bad request
                status: 400
                detail: The submitted request could not be processed.
                instance: /requests/req_123
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        X-RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
        X-RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://example.com/problems/rate-limit
            title: Too many requests
            status: 429
            detail: Retry after the documented delay.
    NoContent:
      description: Successful response without a payload
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}

  requestBodies:
    RichPayload:
      required: true
      description: |
        A reusable request body with named examples. OpenDoc can reset the Runner from the first
        explicit example or generate a typed mock from the schema.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RichRequest'}
          examples:
            complete:
              summary: Broad feature example
              value:
                clientRequestId: 123e4567-e89b-12d3-a456-426614174000
                title: OpenDoc capability demonstration
                mode: live
                priority: 5
                ratio: 0.75
                enabled: true
                scheduledAt: '2026-08-15T12:30:00Z'
                dueDate: '2026-08-20'
                contactEmail: developer@example.com
                website: https://github.com/omidgfx/opendoc-ui
                nullableNote: null
                constantKind: showcase
                tags: [docs, runner]
                owner:
                  id: user_123
                  displayName: Original Developer
                  address:
                    line1: Damrak 1
                    city: Amsterdam
                    countryCode: NL
                checkpoints:
                  - {name: Parse, passed: true}
                  - {name: Render, passed: true}
                matrix:
                  - [1, 2]
                  - [3, 4]
                metadata:
                  source: demo
                  audience: developers
            minimal:
              summary: Minimal required values
              value:
                clientRequestId: 123e4567-e89b-12d3-a456-426614174000
                title: Minimal example
                mode: dry-run
    CustomerCommandPayload:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CustomerCommand'}
          examples:
            create:
              summary: Create a customer
              value:
                kind: create
                name: Ada Lovelace
                email: ada@example.com
            link:
              summary: Link an existing customer
              value:
                kind: link
                customerId: cust_123

  mediaTypes:
    DemoJson:
      schema:
        $ref: '#/components/schemas/FreeFormObject'
      examples:
        featureFlags:
          summary: Feature flags
          value:
            product: OpenDoc UI
            features: [docs, runner, schemas, notes, ai]
            enabled: true

  pathItems:
    ReusableEchoPath:
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier declared once on a reusable Path Item Object.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
          example: reusable_123
      get:
        tags: [01 Tour/Reusable paths]
        summary: Resolve a reusable Path Item Object
        operationId: getReusablePathItem
        description: |
          This route is a local `$ref` to `components.pathItems.ReusableEchoPath`.

          **Demonstrates:** internal reference resolution, derived bundled export, reusable path-level
          parameters, deep links after dereferencing, and source immutability. OpenDoc renders from a
          normalized semantic document while retaining the untouched original for download.
        responses:
          '200': {$ref: '#/components/responses/EchoResponse'}

