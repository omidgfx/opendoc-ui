name: Deploy site and demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/demo/
      VITE_LOAD_FROM_URL: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable the Pages demo specification
        run: cp public/demo/config.pages.json public/config.json

      - name: Build the application
        run: npm run build

      - name: Assemble the Pages artifact
        run: |
          rm -rf pages-artifact
          mkdir -p pages-artifact/demo
          cp -R site/. pages-artifact/
          cp -R dist/. pages-artifact/demo/
          touch pages-artifact/.nojekyll pages-artifact/demo/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
