openapi: 3.2.0
info:
  title: OAS 3.2 QUERY Method Fixture
  version: '1.0.0'
  summary: RFC 10008 QUERY — safe and idempotent with a request body
servers:
  - url: https://api.example.com
paths:
  /products:
    query:
      operationId: searchProducts
      summary: Advanced product search
      description: |
        QUERY carries structured filters in the body (like POST) while remaining
        safe and idempotent (like GET). See RFC 10008 / OpenAPI 3.2.
      tags:
        - Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearch'
            examples:
              shoes:
                summary: Filter shoes
                value:
                  filter:
                    category: shoes
                    maxPrice: 100
                  sort:
                    - price_asc
                  limit: 20
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          description: Invalid search body
components:
  schemas:
    ProductSearch:
      type: object
      required:
        - filter
      properties:
        filter:
          type: object
          additionalProperties: true
        sort:
          type: array
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      examples:
        - filter:
            category: shoes
          sort:
            - name
          limit: 10
    ProductList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              price:
                type: number
        total:
          type: integer
