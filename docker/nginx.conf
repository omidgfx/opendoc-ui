server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  sendfile on;

  # Serve every asset with its correct MIME type (css, js, svg, fonts, images,
  # json, ...). Without this table nginx falls back to default_type and the
  # browser refuses stylesheets/scripts served as text/plain or text/html.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  add_header X-Content-Type-Options "nosniff" always;

  gzip on;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss image/svg+xml;
  gzip_comp_level 6;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /config.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Managed AI mode: same-origin proxy to the optional opendoc-ai-gateway
  # compose service (see compose.yaml, profile "managed-ai"). Upstream
  # resolution is lazy, so deployments without the gateway simply serve 502s
  # here and the UI treats that exactly like "no managed backend". Keep the
  # gateway off the public internet: ambient auth trusts this proxy's edge.
  location /api/ai/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ai_gateway_upstream "http://opendoc-ai-gateway:8787";
    proxy_pass $ai_gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Per-user rate limiting key from the SSO edge. The edge must overwrite
    # this header for untrusted requests.
    proxy_set_header X-Forwarded-User $http_x_forwarded_user;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|ico|json|xml|txt)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
